<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Soft Neo-Brutalism Mascot: Friendly Owl / Helper with Graduation Cap & Justice Scales -->
  <!-- Shadow Base -->
  <ellipse cx="64" cy="106" rx="38" ry="8" fill="#0f1b34" opacity="0.15" />
  
  <!-- Body -->
  <rect x="24" y="32" width="72" height="72" rx="28" fill="#ffb703" stroke="#0f1b34" stroke-width="4" />
  
  <!-- Belly -->
  <path d="M 36 68 Q 60 92 84 68 Q 78 98 42 98 Z" fill="#fff" stroke="#0f1b34" stroke-width="3" />
  
  <!-- Eyes -->
  <circle cx="44" cy="54" r="12" fill="#fff" stroke="#0f1b34" stroke-width="3.5" />
  <circle cx="76" cy="54" r="12" fill="#fff" stroke="#0f1b34" stroke-width="3.5" />
  <!-- Pupils -->
  <circle cx="46" cy="54" r="5" fill="#0f1b34" />
  <circle cx="48" cy="52" r="2" fill="#fff" />
  <circle cx="74" cy="54" r="5" fill="#0f1b34" />
  <circle cx="76" cy="52" r="2" fill="#fff" />

  <!-- Cute Beak -->
  <polygon points="60,60 54,68 66,68" fill="#fb8500" stroke="#0f1b34" stroke-width="3" stroke-linejoin="round" />

  <!-- Cheeks Blush -->
  <circle cx="34" cy="66" r="5" fill="#ff6b6b" opacity="0.6" />
  <circle cx="86" cy="66" r="5" fill="#ff6b6b" opacity="0.6" />

  <!-- Graduation / Justice Cap -->
  <polygon points="60,14 96,26 60,36 24,26" fill="#1d3557" stroke="#0f1b34" stroke-width="3.5" stroke-linejoin="round" />
  <rect x="56" y="24" width="8" height="10" fill="#1d3557" stroke="#0f1b34" stroke-width="2" />
  <!-- Tassel -->
  <path d="M 60 25 Q 82 28 84 42" fill="none" stroke="#e63946" stroke-width="3" stroke-linecap="round" />
  <circle cx="84" cy="44" r="3" fill="#e63946" stroke="#0f1b34" stroke-width="1.5" />

  <!-- Sparkle Star (Fairness Symbol) -->
  <path d="M 100 20 L 103 28 L 111 31 L 103 34 L 100 42 L 97 34 L 89 31 L 97 28 Z" fill="#ffd166" stroke="#0f1b34" stroke-width="2" />
</svg>
